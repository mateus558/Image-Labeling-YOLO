[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "image-labeling-tools"
version = "0.1.0"
description = "Tkinter GUI for reviewing and editing YOLO labels."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Your Name"}]
dependencies = [
  "pillow",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
]

[project.urls]
Homepage = "https://github.com/yourname/image_labeling"
Issues = "https://github.com/yourname/image_labeling/issues"

[project.scripts]
label-review = "review_gui:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
  "review_gui",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["review*"]
